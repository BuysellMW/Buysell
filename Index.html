<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuySell - Buy Anything. Sell Anything.</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
      font-size: 16px;
    }

    .search {
      padding: 20px;
      background: white;
      text-align: center;
    }

    .search input {
      width: 85%;
      max-width: 600px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .hero {
      padding: 45px 20px;
      text-align: center;
      background: white;
    }

    .hero h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #666;
      font-size: 18px;
    }

    .buttons {
      margin-top: 25px;
    }

    button {
      padding: 14px 24px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .buy {
      background: #111827;
      color: white;
    }

    .sell {
      background: #16a34a;
      color: white;
    }

    .categories {
      padding: 30px 20px;
      text-align: center;
    }

    .categories h2 {
      margin-bottom: 20px;
    }

    .category {
      display: inline-block;
      background: white;
      padding: 18px;
      margin: 7px;
      border-radius: 10px;
      min-width: 120px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    footer {
      margin-top: 30px;
      padding: 25px;
      background: #111827;
      color: white;
      text-align: center;
    }
  </style>
</head>

<body>

  <header>
    <h1>BuySell</h1>
    <p>Buy Anything. Sell Anything.</p>
  </header>

  <div class="search">
    <input type="text" placeholder="Search for anything...">
  </div>

  <section class="hero">
    <h2>Welcome to BuySell</h2>
    <p>Buy and sell products easily, safely and conveniently.</p>

    <div class="buttons">
      <button class="buy">Start Buying</button>
      <button class="sell">Sell Something</button>
    </div>
  </section>

  <section class="categories">
    <h2>Popular Categories</h2>

    <div class="category">📱 Phones</div>
    <div class="category">🚗 Cars</div>
    <div class="category">🏠 Houses</div>
    <div class="category">👕 Clothes</div>
    <div class="category">🌾 Farming</div>
    <div class="category">🐔 Livestock</div>
  </section>

  <footer>
    <p>© 2026 BuySell</p>
    <p>Buy Anything. Sell Anything.</p>
  </footer>

</body>
  </html>
